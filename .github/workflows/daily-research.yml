# Daily research workflow — prototypes the design in spec/RESEARCH_BRIEF.md.
#
# Dispatch manually with a date (Actions tab → "Daily research" → Run workflow).
# Model is selectable per dispatch (provider/model-id); provide whichever API
# key the chosen provider needs as a repository secret:
#   OPENCODE_API_KEY    — OpenCode Zen models (opencode/<model-id>)
#   OPENROUTER_API_KEY  — OpenRouter models (openrouter/<model-id>, default)
#   ANTHROPIC_API_KEY   — direct Anthropic (claude-* model ids)
#
# The agent only writes files; this workflow owns git: branch, commit, PR.
# Re-running a date overwrites its branch and PR content cleanly.

name: Daily research

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to research (YYYY-MM-DD). Defaults to yesterday UTC."
        required: false
        type: string
      model:
        description: "Model for the agent run (provider/model-id, e.g. opencode/claude-sonnet-5)."
        required: false
        default: "openrouter/stealth/ox-alpha"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Resolve date
        id: date
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(date -u -d yesterday +%F)"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Research day
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEARCH_MODEL: ${{ inputs.model }}
        run: bash scripts/research-day.sh "${{ steps.date.outputs.date }}"

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          BRANCH="research/day-${DATE}"
          git config user.name "sitrep-research[bot]"
          git config user.email "sitrep-research[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/days/"${DATE}".json data/state.json data/research/"${DATE}"
          git commit -m "Day report: ${DATE}" || echo "nothing new to commit"
          git push --force origin "$BRANCH"

          BODY_FILE="data/research/${DATE}/SUMMARY.md"
          [ -f "$BODY_FILE" ] || printf '# Research summary — %s\n\n_(agent did not produce a summary)_\n' "$DATE" > "$BODY_FILE"

          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$BODY_FILE"
            echo "Updated existing PR for branch $BRANCH"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Day report: ${DATE}" \
              --body-file "$BODY_FILE"
          fi

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-corpus-${{ steps.date.outputs.date }}
          path: data/research/
          if-no-files-found: ignore
