# Daily research workflow — prototypes the design in spec/RESEARCH_BRIEF.md.
#
# Dispatch manually with a date (Actions tab → "Daily research" → Run workflow).
# Model is selectable per dispatch (provider/model-id); provide whichever API
# key the chosen provider needs as a repository secret:
#   OPENCODE_API_KEY    — OpenCode Zen models (opencode/<model-id>)
#   OPENROUTER_API_KEY  — OpenRouter models (openrouter/<model-id>, default)
#   ANTHROPIC_API_KEY   — direct Anthropic (claude-* model ids)
#
# Durability model: git is the state store. The research job commits each corpus
# item as the agent files it, then the finished day report; a separate publish
# job owns the PR, so a publish failure never invalidates research. The brief's
# stages run as individual workflow steps (gather / synthesize / state) for
# per-stage timing and failure visibility in the Actions UI. Re-running a
# date resumes instead of overwriting: committed corpus items are kept and only
# what is missing is regenerated. `publish_only` skips research entirely and
# just opens/updates the PR from the existing branch.
#
# Proof of work: each stage's full agent transcript (NDJSON events + exported
# session JSON) is captured under data/research/<DATE>/scratch/sessions/
# (gitignored) and uploaded to the US_IRAN_RESEARCH R2 bucket, which the web app
# reads at /research/<DATE>. Requires CLOUDFLARE_ACCOUNT_ID +
# CLOUDFLARE_API_TOKEN secrets with R2 edit permission on bucket
# "us-iran-research". Transcript upload failures never fail research or block
# the PR. Resumed runs restore the day's already-uploaded transcripts first so
# the manifest keeps covering every stage.
#
# Retesting without redoing work — dispatch with:
#   stages: "B,C"   skip gather (corpus already on the research branch)
#   stages: "none"  no agent time at all: restore + upload transcripts, open PR
#                   (an empty value falls back to the default of all stages)
# Skipped stages keep whatever transcripts were previously uploaded; the
# pipeline scripts are always re-applied onto the resumed branch so capture
# works even when that branch was cut from an older revision.

name: Daily research

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to research (YYYY-MM-DD). Defaults to yesterday UTC."
        required: false
        type: string
      model:
        description: "Model for the agent run (provider/model-id, e.g. opencode/claude-sonnet-5)."
        required: false
        default: "openrouter/stealth/ox-alpha"
        type: string
      publish_only:
        description: "Skip research; open/update the PR from the existing branch."
        required: false
        default: false
        type: boolean
      stages:
        description: >-
          Stages to run, subset of A,B,C (e.g. "B,C" to skip an already-gathered
          stage). Use "none" to skip all agent work (restore + transcript upload
          + PR only) — empty falls back to the default. Skipped stages keep
          their previously uploaded transcripts and committed corpus.
        required: false
        default: "A,B,C"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(date -u -d yesterday +%F)"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

  research:
    needs: setup
    if: ${{ inputs.publish_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_ENABLE_EXA: "1"
      RESEARCH_MODEL: ${{ inputs.model }}
      RESEARCH_GIT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      # "Prepare research branch" checks out the research branch, which still
      # carries whatever pipeline scripts it was cut from. Keep the dispatched
      # versions so resumed runs always use the current capture/upload logic.
      - name: Stash pipeline scripts
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-scripts"
          cp scripts/research-day.sh \
             scripts/build-research-manifest.mjs \
             scripts/upload-research-r2.sh \
             scripts/restore-research-r2.sh \
             "$RUNNER_TEMP/pipeline-scripts/"

      - name: Prepare research branch
        env:
          DATE: ${{ needs.setup.outputs.date }}
        run: |
          BRANCH="research/day-${DATE}"
          git config user.name "sitrep-research[bot]"
          git config user.email "sitrep-research[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            echo "Resuming ${BRANCH}: existing corpus items are kept."
          else
            git checkout -B "$BRANCH"
            echo "Starting fresh branch ${BRANCH}."
          fi

      - name: Restore pipeline scripts onto research branch
        run: cp "$RUNNER_TEMP/pipeline-scripts/"* scripts/

      - name: Restore prior transcripts (resume support)
        continue-on-error: true
        env:
          DATE: ${{ needs.setup.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/restore-research-r2.sh "$DATE"

      - name: Stage A — context + gather
        if: ${{ contains(inputs.stages, 'A') }}
        timeout-minutes: 40
        run: bash scripts/research-day.sh "${{ needs.setup.outputs.date }}" A

      # Checkpoint after every stage: committed progress survives a later
      # stage's timeout, and the next dispatch resumes from the branch.
      - name: Checkpoint branch (gather)
        if: ${{ contains(inputs.stages, 'A') }}
        env:
          DATE: ${{ needs.setup.outputs.date }}
        run: git push --force origin "research/day-${DATE}"

      - name: Stage B — synthesize + validate
        if: ${{ contains(inputs.stages, 'B') }}
        timeout-minutes: 15
        run: bash scripts/research-day.sh "${{ needs.setup.outputs.date }}" B

      - name: Checkpoint branch (day report)
        if: ${{ contains(inputs.stages, 'B') }}
        env:
          DATE: ${{ needs.setup.outputs.date }}
        run: git push --force origin "research/day-${DATE}"

      - name: Stage C — state + summary
        if: ${{ contains(inputs.stages, 'C') }}
        timeout-minutes: 10
        run: bash scripts/research-day.sh "${{ needs.setup.outputs.date }}" C

      - name: Upload transcripts to R2 (proof of work)
        if: ${{ always() }}
        continue-on-error: true
        env:
          DATE: ${{ needs.setup.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/upload-research-r2.sh "$DATE"

      - name: Push research branch
        env:
          DATE: ${{ needs.setup.outputs.date }}
        run: git push --force origin "research/day-${DATE}"

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-corpus-${{ needs.setup.outputs.date }}
          path: data/research/
          if-no-files-found: ignore

  publish:
    needs: [setup, research]
    if: ${{ !cancelled() && (inputs.publish_only == true || needs.research.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/day-${{ needs.setup.outputs.date }}

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.setup.outputs.date }}
        run: |
          BRANCH="research/day-${DATE}"
          BODY_FILE="data/research/${DATE}/SUMMARY.md"
          [ -f "$BODY_FILE" ] || printf '# Research summary — %s\n\n_(agent did not produce a summary)_\n' "$DATE" > "$BODY_FILE"

          if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$BODY_FILE"
            echo "Updated existing PR for branch $BRANCH"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Day report: ${DATE}" \
              --body-file "$BODY_FILE"
          fi
